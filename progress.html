      "date": "2026-10-11",
      "who": "cline",
      "task": "fix-tower-click-mask",
      "what": "Split the tower art's size away from image_xscale, because a collision mask scales with image_xscale and the tower's click mask therefore arrived at half size. obj_tower already carried spr_tower_click_region (32x64: one cell wide, two cells tall) and it was correct; obj_tower/Create_0 drew the art with image_xscale = image_yscale = 0.5, so the mask was handed to the game as 16x32. The size moved into a new draw_scale (0.5 placed, 0.25 for the placement ghost), image_xscale/image_yscale are now +/-1 FACING ONLY, and a new scr_draw_self_scaled() is the one place that draws at the art's size and re-applies the facing sign. Every consumer of the size followed: scr_drawLight's shadow silhouette (guarded on the instance having a draw_scale, so monsters are unchanged), scr_drawGlowOutline (the halo now takes the size), draw_self_part (optional _sx/_sy, so its existing callers behave identically) and the upgrade tween, which now writes draw_scale and can no longer un-mirror a tower. The step-1 click box was deleted: Step_1 asks the mask itself with position_meeting, and _levelControl tie-breaks two stacked towers by the one whose own cell holds the pointer. In the same session all seven music tracks were mapped to their regions in music_data - mus_title plus mus_world1..mus_world6 - with the mapping read off each file's estimated tempo rather than assumed, and the brief's wiring table corrected: mus_world3 and mus_world4 are Desert and Jungle, not retired. Written up as LL-033. (fix-tower-click-mask)"
    },
    {
      "date": "2026-10-11",
      "who": "cline",
      "task": "fix-tower-click-mask",
      "what": "Made the placement ghost ask the GRID instead of a collision mask. obj_tower_edit/Step_0 decided whether the cell under the ghost was taken with position_meeting(x, y, obj_tower), which reads the tower's 32x64 click mask - so the cell ABOVE a tower went red, while obj_tower/Create_0 blocks exactly one cell of LEVEL.path_grid and two towers are allowed to stack. It now asks the grid it is about to write into - mp_grid_get_cell(LEVEL.path_grid, (x + cell_w) div cell_w, (y + cell_h) div cell_h) != 0 - which is the same arithmetic obj_tower/Create_0 and scr_grid_block_instances use, plus the _spawn test that was already there (the spawn is not in the grid at all, and _spawn is also the parent of obj_wall, whose 32x32 art covers one cell, which backstops the part of the deploy countdown before scr_resetDrawPath puts the walls into the grid). The refusal now names its reason - META [PATH] placement refused: \u003cwhy> - where it used to click, thud and vanish in silence, so a wrong-looking cell is one log line rather than a hunt. Folded into LL-033, whose mask caused both the tiny click area and the lying ghost. (fix-tower-click-mask)"
    },
    {
      "date": "2026-10-11",
      "who": "cline",
      "task": "audio-region-music",
      "what": "Fixed the silence on every stage, and it was not the music. rayu's runtime log (`GameMakerStudio2/debug.log`) had one line: `META  [MUSIC] region 1 \"Wilted Sprouts\" has no track yet - playing nothing` - the right region and the right title, so the table and music_for_region() were fine and only `_music.sound` was rejected. The guard at the top of scr_music_start_level tested it with `!is_real(_sound) || _sound \u003c 0`, and is_real() asks 'is this a plain number' while an asset reference is not one - so is_real(mus_world1) is false for a perfectly good sound and the guard refused EVERY region theme. The menu theme survived because obj_title and the Menu reach audio_play_sound_on() without passing through the guard. The guard now tests the two values music_data actually documents (-1 for 'not generated yet', undefined for 'no row') and the refusal says WHICH fired, the play line prints typeof(_sound) so the representation is on the record rather than assumed, and the loop-point pair 0.0/0.0 is no longer set for a whole-track loop (loop = true already repeats the track, and 0.0/0.0 depends on the runtime reading 'loop end 0' as 'end of file'). The asset was cleared on the way: mus_world1.yy is byte-identical to mus_world2.yy apart from the duration, and the IDE's asset cache held a valid converted mus_world1.wav with \u003cDuration>163.53\u003c/Duration> beside it. Written up as LL-034, with the guard rail 'never ask a TYPE question about an asset'. (audio-region-music)"
    },
    {
      "date": "2026-10-12",
      "who": "cline",
      "task": "fix-tower-click-mask",
      "what": "Fixed the in-water crash my own optional arguments caused. obj_mon/Draw_0 calls draw_self_part(0,0,1,0.75,0) - five arguments - while draw_self_part declares seven (argument0..argument6), and the optional _sx/_sy were being detected with `(argument_count > 5) ? argument5 : image_xscale`. The argument list is sized to the DECLARED arity and the unpassed parameters are padded with undefined, so argument_count was not 5, the ternary took the argument5 branch, and the next line multiplied by undefined: `undefined value at gml_Script_draw_self_part (line 33) - _x = x - sprite_get_xoffset(sprite_index)*_sx`, every frame a monster was in water. The error text itself proves the mechanism - 'undefined value' (arithmetic on undefined, so the slot EXISTS) rather than 'not set before reading it' - and image_xscale cannot be the culprit because obj_mon only ever assigns it real numbers (0, +/-abs, base_scale * _t, +/-base_scale, with base_scale 1 from Create or 0.25/0.5 from scr_level_spawn). scr_meta_log(_tag) declares one parameter and its loop prints all ten arguments, so argument_count = max(declared, passed) fits both cases; every other argument_count user in the project declares ZERO parameters, which is exactly why nothing else ever broke. The test is now is_undefined(argument5)/is_undefined(argument6) - the project's own 'not there' question, and independent of how argument_count is computed - with the defaults unchanged (image_xscale carries the monster's size AND sign, as the original sprite_xoffset code assumed). scr_drawGlowOutline carried the same brittle shape (argument_count > 0) and was fixed with it. obj_mon/Draw_0 keeps its short call on purpose: it is the test of the default path. Written up as LL-035. (fix-tower-click-mask)"
    }
  ]
}
</script>
<script>
const DATA = JSON.parse(document.getElementById('progress-data').textContent);
const SIG = document.getElementById('progress-data').dataset.sig;
let DOC = DATA;
const STATUSES = ['backlog', 'next', 'doing', 'review', 'done'];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Mirrors progress.loose_signature() exactly: sort by id with code-point
   comparison, then join id:status:updated.  If the files this page was built
   from have moved on, we say so instead of showing a stale board. */
function looseSig(d) {
  const rows = (d.tasks || []).map((t) => [t.id || '', t.status || '', t.updated || '']);
  rows.sort((a, b) => (a[0] < b[0] ? -1 : (a[0] > b[0] ? 1 : 0)));
  const meta = d.meta || {};
  return (meta.updated || '') + '|' + rows.length + '|' + rows.map((r) => r.join(':')).join(',');
}

function daysSince(iso) {
  const t = Date.parse(iso || '');
  if (isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}

const personName = (key) => ((DOC.people || {})[key] || {}).name || key;
const personColor = (key) => ((DOC.people || {})[key] || {}).color || '#96a0ae';
const taskById = (id) => (DOC.tasks || []).find((t) => t.id === id);

/* Prefs are cosmetic only - the JSON stays the source of truth - so keeping
   them in localStorage is safe and makes the page open where you left it. */
const PREF_KEY = 'pd-progress-prefs';
let prefs = { who: 'all', area: 'all' };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) {}
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} }

function visible(t) {
  if (prefs.who !== 'all') {
    const owned = t.owner === prefs.who || t.owner === 'both';
    if (!owned && t.awaiting !== prefs.who) return false;
  }
  if (prefs.area !== 'all' && t.area !== prefs.area) return false;
  return true;
}

const prio = (t) => t.prio || 9;
const byBoardOrder = (a, b) =>
  (prio(a) - prio(b)) || String(a.phase).localeCompare(String(b.phase)) || a.id.localeCompare(b.id);

function card(t, mode) {
  const chips = [`<span class="chip pill" style="color:${esc(personColor(t.owner === 'both' ? (DOC.meta.viewer || '') : t.owner))}">${esc(t.owner === 'both' ? 'both' : personName(t.owner))}</span>`];
  if (t.area) chips.push(`<span class="chip pill">${esc(t.area)}</span>`);
  if (t.size) chips.push(`<span class="chip pill">${esc(t.size)}</span>`);
  if (t.phase) chips.push(`<span class="chip pill">ph&nbsp;${esc(t.phase)}</span>`);
  chips.push(`<span class="chip pill">P${esc(t.prio)}</span>`);
  if (t.awaiting && t.awaiting !== 'none') {
    chips.push(`<span class="chip pill await">waiting on ${esc(personName(t.awaiting))}</span>`);
  }
  const age = daysSince(t.updated);
  const stale = age !== null && age > 14 && t.status !== 'done';
  const refs = (t.refs && t.refs.length)
    ? `<div class="refs">${t.refs.map(esc).join(' · ')}</div>` : '';
  const needs = t.needs ? `<div class="needs">&rarr; ${esc(t.needs)}</div>` : '';
  const notes = t.notes ? `<div class="notes">${esc(t.notes)}</div>` : '';
  const when = mode === 'done'
    ? `done ${esc(t.done || '')}`
    : `updated ${esc(t.updated || '')}${age !== null ? ' · ' + age + 'd' : ''}`;
  return `<article class="card prio${esc(t.prio)}${stale ? ' stale-card' : ''}" data-id="${esc(t.id)}">
    <div class="id">${esc(t.id)}</div>
    <div class="ttl">${esc(t.title)}</div>
    <div class="chips">${chips.join('')}</div>
    ${needs}${notes}${refs}
    <div class="age">${when}</div>
    <button class="copy" data-copy="${esc(t.id)}">copy JSON</button>
  </article>`;
}

function filterChips() {
  const out = [];
  const who = [['all', 'Everyone']].concat(Object.keys(DOC.people || {}).map((k) => [k, personName(k)]));
  out.push('<span class="sub" style="align-self:center;margin-right:2px">who</span>');
  who.forEach(([key, label]) => out.push(
    `<button class="chip${prefs.who === key ? ' on' : ''}" data-who="${esc(key)}">${esc(label)}</button>`));
  const areas = ['all'].concat([...new Set((DOC.tasks || []).map((t) => t.area))].sort());
  out.push('<span class="sub" style="align-self:center;margin:0 2px 0 12px">area</span>');
  areas.forEach((key) => out.push(
    `<button class="chip${prefs.area === key ? ' on' : ''}" data-area="${esc(key)}">${key === 'all' ? 'All areas' : esc(key)}</button>`));
  return out.join('');
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}

function render() {
  const meta = DOC.meta || {};
  const viewer = meta.viewer || Object.keys(DOC.people || {})[0];
  const all = DOC.tasks || [];
  const title = (meta.project || 'Progress') + ' — progress';
  document.title = title;
  $('title').textContent = title;

  const counts = {};
  STATUSES.forEach((s) => { counts[s] = all.filter((t) => t.status === s).length; });
  $('sub').textContent = 'Updated ' + (meta.updated || '?') + ' · ' + all.length + ' cards · '
    + STATUSES.filter((s) => counts[s]).map((s) => counts[s] + ' ' + s).join(' · ');
  $('filters').innerHTML = filterChips();

  /* ---- the strip: who has the ball ---------------------------------- */
  const open = all.filter((t) => t.status !== 'done');
  let strip = '';
  Object.keys(DOC.people || {}).forEach((key) => {
    const waiting = open.filter((t) => t.awaiting === key).sort(byBoardOrder).filter(visible);
    if (!waiting.length) return;
    const you = key === viewer;
    strip += '<h2>' + (you ? '⚠ ' : '') + 'Waiting on ' + (you ? 'you (' : '')
      + esc(personName(key)) + (you ? ')' : '') + ' — ' + waiting.length + '</h2>'
      + '<div class="strip' + (you ? '' : ' secondary') + '">'
      + waiting.map((t) => card(t)).join('') + '</div>';
  });
  $('waiting').innerHTML = strip
    || '<h2>Nothing is waiting on anyone</h2><div class="sub">Every open card has a free ball.</div>';

  /* ---- right now ---------------------------------------------------- */
  const focus = DOC.focus || {};
  const listOf = (ids) => (ids || []).map((id) => '<code>' + esc(id) + '</code>').join(', ') || '—';
  $('focusrow').innerHTML =
    (focus.note ? '<div style="flex:1 1 100%">' + esc(focus.note) + '</div>' : '')
    + '<div><span class="k">Now</span>' + listOf(focus.now) + '</div>'
    + '<div><span class="k">Next</span>' + listOf(focus.next) + '</div>';

  /* ---- the board ---------------------------------------------------- */
  const board = STATUSES.filter((s) => s !== 'done').map((status) => {
    let group = all.filter((t) => t.status === status && visible(t)).sort(byBoardOrder);
    return '<section class="col ' + status + '"><h3><span>' + status + '</span><span>'
      + group.length + '</span></h3>'
      + group.map((t) => card(t)).join('') + '</section>';
  }).join('');
  const done = all.filter((t) => t.status === 'done' && visible(t))
    .sort((a, b) => String(b.done || '').localeCompare(String(a.done || ''))).slice(0, 8);
  $('board').innerHTML = board
    + '<section class="col done"><h3><span>done — newest ' + done.length + ' of ' + counts.done
    + '</span></h3>' + done.map((t) => card(t, 'done')).join('') + '</section>';

  /* ---- phases and the log ------------------------------------------- */
  const phases = [...new Set(all.map((t) => String(t.phase)))].sort();
  const bar = (d, n) => {
    const filled = n ? Math.round(10 * d / n) : 0;
    return '▓'.repeat(filled) + '░'.repeat(10 - filled) + ' ' + (n ? Math.round(100 * d / n) : 0) + '%';
  };
  $('phases').innerHTML = '<table><tr><th>phase</th><th>done</th><th>total</th><th></th></tr>'
    + phases.map((p) => {
        const group = all.filter((t) => String(t.phase) === p);
        const d = group.filter((t) => t.status === 'done').length;
        return '<tr><td>' + esc(p) + '</td><td>' + d + '</td><td>' + group.length
          + '</td><td class="bar">' + bar(d, group.length) + '</td></tr>';
      }).join('') + '</table>';

  $('log').innerHTML = (DOC.log || []).slice(-15).reverse().map((e) =>
    '<li><b>' + esc(e.date) + '</b> ' + esc(personName(e.who)) + ' — ' + esc(e.what)
    + (e.task ? ' <code>' + esc(e.task) + '</code>' : '') + '</li>').join('');

  $('footer').textContent = 'Source of truth: progress.json (sha ' + SIG + '). '
    + (meta.how_to || '');
}

document.addEventListener('click', (ev) => {
  const who = ev.target.closest('[data-who]');
  if (who) { prefs.who = who.dataset.who; savePrefs(); render(); return; }
  const area = ev.target.closest('[data-area]');
  if (area) { prefs.area = area.dataset.area; savePrefs(); render(); return; }
  const copy = ev.target.closest('[data-copy]');
  if (copy) {
    const t = taskById(copy.dataset.copy);
    copyText(JSON.stringify(t, null, 2)).then(
      () => { copy.textContent = 'copied!'; setTimeout(() => { copy.textContent = 'copy JSON'; }, 1400); },
      () => { copy.textContent = 'clipboard blocked'; });
  }
});

render();

/* Opened from the file system?  fetch() rejects and we keep the embedded
   snapshot.  Served?  Re-read the JSON and shout if this page is behind it. */
fetch('progress.json', { cache: 'no-store' })
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => {
    if (!d || looseSig(d) === SIG) return;
    DOC = d;
    const el = $('stale');
    el.hidden = false;
    el.textContent = 'This page was built from an older progress.json. '
      + 'Run  PYTHONPATH=python_tools python3 -m gm progress build  — '
      + 'showing the newer file below.';
    render();
  })
  .catch(() => {});
</script>
</body>
