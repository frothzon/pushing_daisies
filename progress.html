r the same attention.  The spr_towerRange decal was RETIRED: it filled the whole circle with a soft wash at 15% and was driven by tower_selection, so a CLICK covered a large part of the garden and the ground under it stopped being readable.  In its place the range is a 3px additive white RING at tower_range_alpha (0.25, raised from 0.15), drawn for the HOVERED tower - three draw_circle calls, because draw_circle draws a 1px outline and takes no width argument, and it is the same call the placement circle already uses (obj_tower_edit/Draw_0).  The ring reads the same _hov as the cell and the level, so all three cannot name different towers (LL-021); the guard above them now tests max(TOWER.level, TOWER.range) - the LAST field the block reaches for - so reordering the enum cannot turn a guard into a crash.  ONE EXCEPTION KEPT ON PURPOSE: while the pointer is over the card's range band, the SELECTED tower is ringed, because the band exists to name a tower's reach and would otherwise promise something it no longer delivers.  NOTE FOR THE OWNER: spr_towerRange is now referenced by nothing but the project's resource list - it has not been deleted, so the decal can be brought back, and it can be retired with it if you prefer; that decision is not worth a card of its own.",

      "needs": "Reload and upgrade a tower: L2 is RED, L3 ORANGE, L4 GREEN, L5 BLUE, each drawn ADDITIVELY at 25% opacity and at 75% while the pointer is over that tower. Say whether the four colours read against the ground art - additive means they ADD light, so a pale ring over pale ground is the weakest case and the one to look at - and whether the grey-to-white image_blend tint stays. Also look at a tower standing IN water: the ring should stop at the waterline.",
      "notes": "The outline is about to become the ONLY thing that says what level a tower is - the size stops moving (choose-upgrade-scale) - so this card decides how readable an upgrade is. Levels 2-10 need a colour each; level 1 has none, by your instruction. The cap is 5 + mastery, so 10 is the real ceiling and nine colours covers the whole campaign. CONSTRAINTS, all from things the game already uses: red and green are the placement ghost (spr_noPlace) at the exact moment the player is looking at a tower, c_yellow is the damage/range float text, c_lime is the level number on the tower card, and orange is the despawn light. The ring also has to read against grass, dirt AND the blue water, which is what makes the blue rungs the ones to check first. PROPOSED (mine, and only a starting point): L2 #4FD16B green, L3 #2FD3C0 teal, L4 #35B6FF azure, L5 #5C8CFF blue, L6 #8A6BFF indigo, L7 #B95CFF violet, L8 #E85CD8 magenta, L9 #FF6FB0 pink, L10 #FFD24A gold - a cool to hot sweep with gold at the cap reading as maxed. The competing idea is a straight heat ramp (green, yellow, orange, red, white), which is more obviously stronger but spends red on a level cue. ALSO ON THIS CARD: the tint. Placement sets image_blend = c_gray and an upgrade lerps it to c_white, so a tower is already dimmer at level 1 than at level 10 - a second level signal that will make a coloured ring read duller on exactly the towers that need it most. Dropping it (placed towers become c_white, art at its true colours) is the recommendation; keeping it is a legitimate choice, it just has to be a choice. FIRST PASS SHIPPED 2026-10-15 (tower-level-look): the mechanism is in with the nine colours above, so this is a review of something you can look at rather than a question to answer blind. The tint is deliberately UNTOUCHED - dropping it changes the look of every tower on the map, and that is not a thing to decide on your behalf. One more thing worth a look while you are there: a tower standing IN water, where the ring should stop at the waterline rather than draw an edge along the crop. NAMED 2026-10-15 (this is the answer to the question the card was asking): red, orange, green and blue, one per rung, drawn additively at 25% opacity and 75% while the pointer is over the tower. SHIPPED the same day, and the mechanism changed to make it possible - see LL-046. The ring pass is now RING-ONLY (shd_outline writes alpha 0 on the art's own pixels) and the body is drawn before it by scr_drawSelfOutlined, because a blend mode belongs to the PASS and not to the thing you meant to blend: an additive pass that also drew the body would ADD the tower to the background instead of replacing it. The opacity rides on outlineColor's fourth component (draw_set_alpha() cannot reach a shader that writes gl_FragColor itself), and the blend mode is set LAST in scr_outline_begin - after every early return - and put back in scr_outline_end beside shader_reset(), because a leaked bm_add leaves the rest of the frame additive with no error to find it by. The four hues are make_colour_rgb(255,64,64) RED, (255,152,48) ORANGE, (72,224,96) GREEN, (64,144,255) BLUE - deliberately NOT c_red/c_green/c_blue, because GameMaker's c_green is (0,128,0) and a dark green barely registers when it is added rather than painted. Levels 6-10 (the mastery ladder) are still the first pass and are now their own card, tower-ring-mastery-palette. STILL OPEN HERE: whether the four read well in play, and the tint question - the tint is deliberately untouched, because dropping it changes every tower on the map.",

<script>
const DATA = JSON.parse(document.getElementById('progress-data').textContent);
const SIG = document.getElementById('progress-data').dataset.sig;
let DOC = DATA;
const STATUSES = ['backlog', 'next', 'doing', 'review', 'done'];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Mirrors progress.loose_signature() exactly: sort by id with code-point
   comparison, then join id:status:updated.  If the files this page was built
   from have moved on, we say so instead of showing a stale board. */
function looseSig(d) {
  const rows = (d.tasks || []).map((t) => [t.id || '', t.status || '', t.updated || '']);
  rows.sort((a, b) => (a[0] < b[0] ? -1 : (a[0] > b[0] ? 1 : 0)));
  const meta = d.meta || {};
  return (meta.updated || '') + '|' + rows.length + '|' + rows.map((r) => r.join(':')).join(',');
}

function daysSince(iso) {
  const t = Date.parse(iso || '');
  if (isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}

const personName = (key) => ((DOC.people || {})[key] || {}).name || key;
const personColor = (key) => ((DOC.people || {})[key] || {}).color || '#96a0ae';
const taskById = (id) => (DOC.tasks || []).find((t) => t.id === id);

/* Prefs are cosmetic only - the JSON stays the source of truth - so keeping
   them in localStorage is safe and makes the page open where you left it. */
const PREF_KEY = 'pd-progress-prefs';
let prefs = { who: 'all', area: 'all' };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) {}
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} }

function visible(t) {
  if (prefs.who !== 'all') {
    const owned = t.owner === prefs.who || t.owner === 'both';
    if (!owned && t.awaiting !== prefs.who) return false;
  }
  if (prefs.area !== 'all' && t.area !== prefs.area) return false;
  return true;
}

const prio = (t) => t.prio || 9;
const byBoardOrder = (a, b) =>
  (prio(a) - prio(b)) || String(a.phase).localeCompare(String(b.phase)) || a.id.localeCompare(b.id);

function card(t, mode) {
  const chips = [`<span class="chip pill" style="color:${esc(personColor(t.owner === 'both' ? (DOC.meta.viewer || '') : t.owner))}">${esc(t.owner === 'both' ? 'both' : personName(t.owner))}</span>`];
  if (t.area) chips.push(`<span class="chip pill">${esc(t.area)}</span>`);
  if (t.size) chips.push(`<span class="chip pill">${esc(t.size)}</span>`);
  if (t.phase) chips.push(`<span class="chip pill">ph&nbsp;${esc(t.phase)}</span>`);
  chips.push(`<span class="chip pill">P${esc(t.prio)}</span>`);
  if (t.awaiting && t.awaiting !== 'none') {
    chips.push(`<span class="chip pill await">waiting on ${esc(personName(t.awaiting))}</span>`);
  }
  const age = daysSince(t.updated);
  const stale = age !== null && age > 14 && t.status !== 'done';
  const refs = (t.refs && t.refs.length)
    ? `<div class="refs">${t.refs.map(esc).join(' · ')}</div>` : '';
  const needs = t.needs ? `<div class="needs">&rarr; ${esc(t.needs)}</div>` : '';
  const notes = t.notes ? `<div class="notes">${esc(t.notes)}</div>` : '';
  const when = mode === 'done'
    ? `done ${esc(t.done || '')}`
    : `updated ${esc(t.updated || '')}${age !== null ? ' · ' + age + 'd' : ''}`;
  return `<article class="card prio${esc(t.prio)}${stale ? ' stale-card' : ''}" data-id="${esc(t.id)}">
    <div class="id">${esc(t.id)}</div>
    <div class="ttl">${esc(t.title)}</div>
    <div class="chips">${chips.join('')}</div>
    ${needs}${notes}${refs}
    <div class="age">${when}</div>
    <button class="copy" data-copy="${esc(t.id)}">copy JSON</button>
  </article>`;
}

function filterChips() {
  const out = [];
  const who = [['all', 'Everyone']].concat(Object.keys(DOC.people || {}).map((k) => [k, personName(k)]));
  out.push('<span class="sub" style="align-self:center;margin-right:2px">who</span>');
  who.forEach(([key, label]) => out.push(
    `<button class="chip${prefs.who === key ? ' on' : ''}" data-who="${esc(key)}">${esc(label)}</button>`));
  const areas = ['all'].concat([...new Set((DOC.tasks || []).map((t) => t.area))].sort());
  out.push('<span class="sub" style="align-self:center;margin:0 2px 0 12px">area</span>');
  areas.forEach((key) => out.push(
    `<button class="chip${prefs.area === key ? ' on' : ''}" data-area="${esc(key)}">${key === 'all' ? 'All areas' : esc(key)}</button>`));
  return out.join('');
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}

function render() {
  const meta = DOC.meta || {};
  const viewer = meta.viewer || Object.keys(DOC.people || {})[0];
  const all = DOC.tasks || [];
  const title = (meta.project || 'Progress') + ' — progress';
  document.title = title;
  $('title').textContent = title;

  const counts = {};
  STATUSES.forEach((s) => { counts[s] = all.filter((t) => t.status === s).length; });
  $('sub').textContent = 'Updated ' + (meta.updated || '?') + ' · ' + all.length + ' cards · '
    + STATUSES.filter((s) => counts[s]).map((s) => counts[s] + ' ' + s).join(' · ');
  $('filters').innerHTML = filterChips();

  /* ---- the strip: who has the ball ---------------------------------- */
  const open = all.filter((t) => t.status !== 'done');
  let strip = '';
  Object.keys(DOC.people || {}).forEach((key) => {
    const waiting = open.filter((t) => t.awaiting === key).sort(byBoardOrder).filter(visible);
    if (!waiting.length) return;
    const you = key === viewer;
    strip += '<h2>' + (you ? '⚠ ' : '') + 'Waiting on ' + (you ? 'you (' : '')
      + esc(personName(key)) + (you ? ')' : '') + ' — ' + waiting.length + '</h2>'
      + '<div class="strip' + (you ? '' : ' secondary') + '">'
      + waiting.map((t) => card(t)).join('') + '</div>';
  });
  $('waiting').innerHTML = strip
    || '<h2>Nothing is waiting on anyone</h2><div class="sub">Every open card has a free ball.</div>';

  /* ---- right now ---------------------------------------------------- */
  const focus = DOC.focus || {};
  const listOf = (ids) => (ids || []).map((id) => '<code>' + esc(id) + '</code>').join(', ') || '—';
  $('focusrow').innerHTML =
    (focus.note ? '<div style="flex:1 1 100%">' + esc(focus.note) + '</div>' : '')
    + '<div><span class="k">Now</span>' + listOf(focus.now) + '</div>'
    + '<div><span class="k">Next</span>' + listOf(focus.next) + '</div>';

  /* ---- the board ---------------------------------------------------- */
  const board = STATUSES.filter((s) => s !== 'done').map((status) => {
    let group = all.filter((t) => t.status === status && visible(t)).sort(byBoardOrder);
    return '<section class="col ' + status + '"><h3><span>' + status + '</span><span>'
      + group.length + '</span></h3>'
      + group.map((t) => card(t)).join('') + '</section>';
  }).join('');
  const done = all.filter((t) => t.status === 'done' && visible(t))
    .sort((a, b) => String(b.done || '').localeCompare(String(a.done || ''))).slice(0, 8);
  $('board').innerHTML = board
    + '<section class="col done"><h3><span>done — newest ' + done.length + ' of ' + counts.done
    + '</span></h3>' + done.map((t) => card(t, 'done')).join('') + '</section>';

  /* ---- phases and the log ------------------------------------------- */
  const phases = [...new Set(all.map((t) => String(t.phase)))].sort();
  const bar = (d, n) => {
    const filled = n ? Math.round(10 * d / n) : 0;
    return '▓'.repeat(filled) + '░'.repeat(10 - filled) + ' ' + (n ? Math.round(100 * d / n) : 0) + '%';
  };
  $('phases').innerHTML = '<table><tr><th>phase</th><th>done</th><th>total</th><th></th></tr>'
    + phases.map((p) => {
        const group = all.filter((t) => String(t.phase) === p);
        const d = group.filter((t) => t.status === 'done').length;
        return '<tr><td>' + esc(p) + '</td><td>' + d + '</td><td>' + group.length
          + '</td><td class="bar">' + bar(d, group.length) + '</td></tr>';
      }).join('') + '</table>';

  $('log').innerHTML = (DOC.log || []).slice(-15).reverse().map((e) =>
    '<li><b>' + esc(e.date) + '</b> ' + esc(personName(e.who)) + ' — ' + esc(e.what)
    + (e.task ? ' <code>' + esc(e.task) + '</code>' : '') + '</li>').join('');

  $('footer').textContent = 'Source of truth: progress.json (sha ' + SIG + '). '
    + (meta.how_to || '');
}

document.addEventListener('click', (ev) => {
  const who = ev.target.closest('[data-who]');
  if (who) { prefs.who = who.dataset.who; savePrefs(); render(); return; }
  const area = ev.target.closest('[data-area]');
  if (area) { prefs.area = area.dataset.area; savePrefs(); render(); return; }
  const copy = ev.target.closest('[data-copy]');
  if (copy) {
    const t = taskById(copy.dataset.copy);
    copyText(JSON.stringify(t, null, 2)).then(
      () => { copy.textContent = 'copied!'; setTimeout(() => { copy.textContent = 'copy JSON'; }, 1400); },
      () => { copy.textContent = 'clipboard blocked'; });
  }
});

render();

/* Opened from the file system?  fetch() rejects and we keep the embedded
   snapshot.  Served?  Re-read the JSON and shout if this page is behind it. */
fetch('progress.json', { cache: 'no-store' })
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => {
    if (!d || looseSig(d) === SIG) return;
    DOC = d;
    const el = $('stale');
    el.hidden = false;
    el.textContent = 'This page was built from an older progress.json. '
      + 'Run  PYTHONPATH=python_tools python3 -m gm progress build  — '
      + 'showing the newer file below.';
    render();
  })
  .catch(() => {});
</script>
